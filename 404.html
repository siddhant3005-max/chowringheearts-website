<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/poppins-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/poppins-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2")}

:root{
  --navy:#14183F; --navy-2:#1B2055; --ink:#2E3192; --ink-deep:#1D1E5C;
  --text:#23244B; --muted:#55577F; --on-navy:#ECE8F6; --on-navy-muted:#B8B5D8;
  --paper:#FAF5EB; --paper-2:#F2E9D7; --card:#FFFCF6;
  --gold-hi:#F0D594; --gold:#D3A24E; --gold-lo:#B98A3E; --gold-ink:#86602A;
  --line:rgba(46,49,146,.13); --line-2:rgba(46,49,146,.24); --line-navy:rgba(240,213,148,.18);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --maxw:1200px; --gutter:clamp(16px,4vw,44px); --head:76px;
  --pattern:url(/assets/pattern-leaf.svg);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
svg{display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.eyebrow{font:500 12px/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 14px}
.on-navy .eyebrow{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--ink-deep);letter-spacing:-.01em;margin:0}
.on-navy h1,.on-navy h2,.on-navy h3{color:#fff}
h1{font-size:clamp(44px,6.4vw,84px);line-height:1}
h2{font-size:clamp(34px,4.6vw,58px);line-height:1.06}
h3{font-size:28px;line-height:1.15}
h1 em,h2 em{font-style:italic;color:var(--ink)}
.on-navy h1 em,.on-navy h2 em{color:var(--gold-hi)}
p{margin:0 0 1em}
.lede{font-size:clamp(16px,1.55vw,19px);color:var(--muted);max-width:34em}
.on-navy .lede{color:var(--on-navy-muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:auto;z-index:100;background:var(--gold-hi);color:var(--navy);padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{position:fixed;left:12px;top:12px}
html:not(.js) .js-only{display:none!important}
html:not(.is-after) .fair-after{display:none!important}
html.is-after .fair-before{display:none!important}
section[id]{scroll-margin-top:calc(var(--head) - 6px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font:500 15px/1 var(--sans);text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease,border-color .2s ease}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-gold{background:linear-gradient(135deg,var(--gold-lo),var(--gold) 45%,var(--gold-hi));color:var(--navy);box-shadow:0 10px 30px -12px rgba(211,162,78,.8)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 14px 34px -12px rgba(211,162,78,.95)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 10px 26px -12px rgba(46,49,146,.8)}
.btn-ink:hover{background:var(--ink-deep);transform:translateY(-1px)}
.btn-line{border:1.5px solid currentColor;color:var(--ink);background:transparent}
.btn-line:hover{background:rgba(127,127,200,.1)}
.on-navy .btn-line,.dock .btn-line{color:var(--on-navy)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.5);color:#fff;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:#fff}
.btn-sm{min-height:42px;padding:0 20px;font-size:14px}

/* header */
.top-sentinel{position:absolute;top:48px;left:0;width:1px;height:1px;pointer-events:none}
.site-head{position:fixed;inset:0 0 auto 0;z-index:40;transition:background .3s ease,box-shadow .3s ease}
.site-head>.wrap{display:flex;align-items:center;justify-content:space-between;height:var(--head);gap:16px}
.site-head.solid,.site-head.menu-open{background:rgba(20,24,63,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line-navy)}
.brand img{height:50px;width:auto}
.nav{display:flex;align-items:center;gap:26px}
.nav .lnk{font:500 14px/1 var(--sans);color:var(--on-navy);text-decoration:none;opacity:.86;padding:8px 0}
.nav .lnk:hover{opacity:1;color:var(--gold-hi)}
.menu-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-navy);background:rgba(255,255,255,.06);color:var(--on-navy);cursor:pointer;padding:0}
.menu-btn svg{width:22px;height:22px}
.menu{background:var(--navy);border-top:1px solid var(--line-navy);box-shadow:0 24px 40px -24px rgba(0,0,0,.6)}
.menu .wrap{display:grid;padding-top:6px;padding-bottom:14px}
.menu a{display:block;padding:15px 2px;color:var(--on-navy);text-decoration:none;font:500 17px/1.2 var(--sans);border-bottom:1px solid var(--line-navy)}
.menu a:last-child{border-bottom:0}
@media (max-width:900px){.nav .lnk{display:none}.menu-btn{display:inline-flex}.nav{gap:10px}.brand img{height:42px}}
@media (min-width:901px){.menu{display:none!important}}
html:not(.js) .menu-btn{display:none!important}

/* hero */
.hero{position:relative;background:var(--navy);color:var(--on-navy);overflow:hidden;padding:clamp(110px,14vw,150px) 0 clamp(64px,8vw,110px)}
.hero::before,.buyers::before,.site-foot::before{content:"";position:absolute;inset:0;background-image:var(--pattern);background-size:180px 180px;opacity:.07;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(46% 56% at 73% 46%,rgba(211,162,78,.17),rgba(211,162,78,0) 100%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,64px);align-items:center}
.hero .lede{margin:24px 0 32px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.fair-pill{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:30px;padding:9px 18px 9px 10px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--line-navy);font:500 13px/1.3 var(--sans);color:var(--on-navy);text-decoration:none}
.fair-pill b{display:inline-grid;place-items:center;height:26px;padding:0 10px;border-radius:999px;background:linear-gradient(135deg,var(--gold-lo),var(--gold-hi));color:var(--navy);font-weight:600;font-size:12px;letter-spacing:.06em}
.fair-pill .count{color:var(--gold-hi)}
.fair-pill .sep{opacity:.5}
@media (max-width:520px){.fair-pill .sep{display:none}.fair-pill .count{flex-basis:100%;padding-left:4px}}
.fair-pill:hover{border-color:var(--gold)}
.still{position:relative;aspect-ratio:1.08/1}
.still .arch{position:absolute;inset:6% 0 0 14%;border-radius:999px 999px 34px 34px;background:linear-gradient(160deg,rgba(240,213,148,.22),rgba(211,162,78,.08) 55%,rgba(211,162,78,0));border:1px solid rgba(240,213,148,.25)}
.still img{position:absolute;filter:drop-shadow(0 28px 30px rgba(0,0,0,.45)) drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.still .p1{width:78%;left:12%;top:18%;transform:rotate(-6deg)}
.still .p2{width:40%;left:0;bottom:4%}
.still .p3{width:44%;right:-2%;bottom:0;transform:rotate(8deg)}
.still .p4{width:9%;right:14%;top:2%;transform:rotate(18deg)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.still{order:-1;max-width:520px;width:100%;margin:0 auto}.hero::after{background:radial-gradient(70% 34% at 50% 26%,rgba(211,162,78,.17),rgba(211,162,78,0) 100%)}}

/* ribbon */
.ribbon{background:linear-gradient(90deg,var(--gold-lo),var(--gold) 50%,var(--gold-lo));color:var(--navy);overflow:hidden;white-space:nowrap}
.ribbon .track{display:inline-flex;gap:38px;padding:14px 0;font:600 13px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;animation:slide 38s linear infinite}
.ribbon .track span::after{content:"✦";margin-left:38px;opacity:.55}
@keyframes slide{to{transform:translateX(-50%)}}

section{position:relative;padding:clamp(72px,9vw,128px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:18px 40px;flex-wrap:wrap;margin-bottom:clamp(30px,4vw,54px)}
.sec-head>div{flex:none;max-width:100%}
.sec-head .lede{margin:0;flex:1 1 300px;max-width:34em}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.about-photo{margin:0;position:relative;border-radius:30px;overflow:hidden;aspect-ratio:6/5;background:var(--paper-2);box-shadow:0 40px 80px -50px rgba(29,30,92,.6)}
.about-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%}
.about-photo figcaption,.stand-photo figcaption{position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);padding:8px 14px;border-radius:14px;background:rgba(20,24,63,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:13px;line-height:1.35}
.about-copy p{font-size:17px}
.about-copy .first{margin-top:22px}
.about-copy .muted{color:var(--muted)}
.facts{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0;padding:0}
.facts li{padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:500 13px/1.2 var(--sans);color:var(--ink-deep)}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}.about-photo{aspect-ratio:4/3}}

/* materials */
.materials{background:var(--paper-2)}
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){.mat-grid{grid-template-columns:1fr;max-width:560px;margin:0 auto}}
.mat{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.mat .stage{position:relative;aspect-ratio:1.25/1;background:radial-gradient(70% 60% at 50% 55%,#fff 0%,var(--paper) 60%,var(--paper-2) 100%)}
.mat .stage img{position:absolute;inset:0;margin:auto;max-width:72%;max-height:74%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 22px 22px rgba(60,40,20,.28)) drop-shadow(0 4px 6px rgba(60,40,20,.2));transition:transform .5s ease}
.mat:hover .stage img{transform:scale(1.04) rotate(-1.5deg)}
.mat .body{padding:22px 24px 26px;display:flex;flex-direction:column;flex:1}
.mat h3{margin-bottom:8px}
.mat p{font-size:15px;color:var(--muted);margin:0 0 16px}
.thumbs{display:flex;gap:10px;margin-top:auto}
.thumbs div{position:relative;flex:1;height:86px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.thumbs img{position:absolute;inset:0;margin:auto;max-width:76%;max-height:76%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(60,40,20,.22))}
.also{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:30px 0 0;padding:0;list-style:none}
.also li{padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:500 13.5px/1.2 var(--sans);color:var(--ink-deep)}
.also .k{background:transparent;border:0;padding:9px 4px;color:var(--gold-ink);letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:600}

/* collection */
.hint{display:flex;align-items:center;gap:10px;margin:-14px 0 22px;font-size:14.5px;color:var(--muted)}
.hint .mini{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink);flex:none}
.hint .mini svg{width:14px;height:14px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:980px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.gallery{grid-template-columns:repeat(2,1fr);gap:12px}.js .gallery:not(.all) .tile:nth-child(n+9){display:none}.tile figcaption{padding:10px 12px 12px}.tile .t{font-size:13px}.pick{top:8px;right:8px;width:40px;height:40px}}
.tile{position:relative;margin:0;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s ease,box-shadow .2s ease}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(211,162,78,.4)}
.tile .ph{all:unset;box-sizing:border-box;position:relative;display:block;aspect-ratio:1/1;flex:1 0 auto;background:radial-gradient(70% 70% at 50% 50%,#fff,var(--paper) 75%);cursor:zoom-in}
.tile .ph:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;border-radius:22px 22px 0 0}
.tile img{position:absolute;inset:0;margin:auto;max-width:78%;max-height:78%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 16px 16px rgba(60,40,20,.25)) drop-shadow(0 3px 4px rgba(60,40,20,.18));transition:transform .45s ease}
.tile:hover img{transform:translateY(-4px) scale(1.04)}
.tile figcaption{padding:12px 16px 14px;border-top:1px solid var(--line);margin-top:auto}
.tile .t{display:block;font:500 13.5px/1.35 var(--sans);color:var(--ink-deep);min-width:0}
.tile .t small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.pick{position:absolute;top:10px;right:10px;z-index:2;display:none;place-items:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line-2);background:rgba(255,255,255,.92);box-shadow:0 6px 16px -8px rgba(29,30,92,.45);color:var(--ink);cursor:pointer;padding:0;transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}
.js .pick{display:grid}
.pick svg{width:18px;height:18px;grid-area:1/1;transition:opacity .2s ease,transform .2s ease}
.pick .i-check{opacity:0;transform:scale(.6)}
.pick:hover{border-color:var(--ink);transform:scale(1.06)}
.tile.on .pick{background:linear-gradient(135deg,var(--gold-lo),var(--gold-hi));border-color:transparent;color:var(--navy)}
.tile.on .pick .i-plus{opacity:0;transform:scale(.6)}
.tile.on .pick .i-check{opacity:1;transform:none}
.more-btn{display:none;margin:18px auto 0}
@media (max-width:640px){.js .more-btn{display:flex}}
.gal-note{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-top:28px;padding:20px 22px;border-radius:20px;border:1px dashed rgba(185,138,62,.6);background:rgba(255,252,246,.7)}
.gal-note p{margin:0;color:var(--muted);max-width:44em}
.gal-note b{color:var(--ink-deep);font-weight:500}

/* how it works */
.buyers{background:var(--navy);color:var(--on-navy);overflow:hidden}
.buyers::before{opacity:.05}
.buyers .wrap{position:relative}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1080px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.steps{grid-template-columns:1fr}}
.step{padding:26px 24px 28px;border-radius:24px;background:rgba(255,255,255,.045);border:1px solid var(--line-navy)}
.step .n{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(211,162,78,.7);color:var(--gold-hi);font:500 24px/1 var(--serif)}
.step h3{margin:16px 0 8px;color:#fff;font-size:26px}
.step p{margin:0;color:var(--on-navy-muted);font-size:15px}

/* fair */
.ticket{position:relative;display:grid;grid-template-columns:1.1fr auto 1fr;border-radius:28px;background:var(--ink);color:#fff;overflow:hidden;box-shadow:0 30px 60px -30px rgba(29,30,92,.6)}
.ticket::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 0% 0%,rgba(240,213,148,.2),transparent 55%);pointer-events:none}
.t-left,.t-mid,.t-right{padding:clamp(24px,3.4vw,40px);position:relative}
.t-left .eyebrow{color:var(--gold-hi)}
.t-left h2{color:#fff;font-size:clamp(32px,3.2vw,44px)}
.t-left p{color:rgba(255,255,255,.82);margin:14px 0 0;font-size:15px}
.t-mid{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-left:2px dashed rgba(240,213,148,.45);border-right:2px dashed rgba(240,213,148,.45);min-width:190px}
.t-mid .hall{font:500 13px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi)}
.t-mid .big{font:600 clamp(58px,6.4vw,86px)/.95 var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;color:#fff;margin:6px 0 10px}
.t-mid .stand{font:600 clamp(18px,2vw,23px)/1.2 var(--sans);letter-spacing:.04em;color:var(--gold-hi)}
.nt{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--paper)}
.nt.tl{left:-16px;top:-15px}.nt.bl{left:-16px;bottom:-15px}.nt.tr{right:-16px;top:-15px}.nt.br{right:-16px;bottom:-15px}
.t-right{display:flex;flex-direction:column;justify-content:center;gap:8px}
.count-chip{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;margin:0 0 4px;padding:7px 13px;border-radius:999px;background:rgba(240,213,148,.16);color:var(--gold-hi);font:600 12.5px/1 var(--sans);letter-spacing:.04em}
.count-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 4px rgba(240,213,148,.2)}
.is-during .count-chip::before{background:#7BD88F;box-shadow:0 0 0 4px rgba(123,216,143,.22)}
.t-right .when{font:500 19px/1.35 var(--sans);color:#fff}
