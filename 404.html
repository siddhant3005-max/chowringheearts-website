:root{
  --navy:#14183F; --navy-2:#1B2055; --navy-3:#242A6A; --ink:#2E3192; --ink-deep:#1D1E5C;
  --text:#23244B; --muted:#5A5C85; --on-navy:#ECE8F6; --on-navy-muted:#B8B5D8;
  --paper:#FAF5EB; --paper-2:#F2E9D7; --card:#FFFCF6;
  --gold-hi:#F0D594; --gold:#D3A24E; --gold-lo:#B98A3E;
  --line:rgba(46,49,146,.13); --line-navy:rgba(240,213,148,.18);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --maxw:1200px; --gutter:clamp(16px,4vw,44px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
svg{display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.eyebrow{font:500 12px/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-lo);margin:0 0 14px}
.on-navy .eyebrow{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--ink-deep);letter-spacing:-.01em;margin:0}
.on-navy h1,.on-navy h2,.on-navy h3{color:#fff}
h1{font-size:clamp(44px,6.4vw,84px);line-height:1}
h2{font-size:clamp(34px,4.6vw,58px);line-height:1.06}
h3{font-size:28px;line-height:1.15}
h1 em,h2 em{font-style:italic;color:var(--ink)}
.on-navy h1 em,.on-navy h2 em{color:var(--gold-hi)}
p{margin:0 0 1em}
.lede{font-size:clamp(16px,1.55vw,19px);color:var(--muted);max-width:34em}
.on-navy .lede{color:var(--on-navy-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font:500 15px/1 var(--sans);text-decoration:none;border:0;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease}
.btn svg{width:18px;height:18px;flex:none}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-gold{background:linear-gradient(135deg,var(--gold-lo),var(--gold) 45%,var(--gold-hi));color:var(--navy);box-shadow:0 10px 30px -12px rgba(211,162,78,.8)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 14px 34px -12px rgba(211,162,78,.95)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 10px 26px -12px rgba(46,49,146,.8)}
.btn-ink:hover{background:var(--ink-deep);transform:translateY(-1px)}
.btn-line{border:1.5px solid currentColor;color:var(--ink);background:transparent}
.on-navy .btn-line{color:var(--on-navy)}
.btn-line:hover{background:rgba(127,127,200,.1)}

/* header */
.site-head{position:fixed;inset:0 0 auto 0;z-index:30;transition:background .3s ease,box-shadow .3s ease,height .3s ease}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px}
.site-head.solid{background:rgba(20,24,63,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line-navy)}
.brand img{height:50px;width:auto}
.nav{display:flex;align-items:center;gap:28px}
.nav a{font:500 14px/1 var(--sans);color:var(--on-navy);text-decoration:none;opacity:.86}
.nav a:hover{opacity:1;color:var(--gold-hi)}
.nav .btn{min-height:42px;padding:0 20px;font-size:14px;opacity:1}
@media (max-width:900px){.nav a:not(.btn){display:none}.brand img{height:42px}}

.hero::after{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;background:radial-gradient(60% 60% at 70% 30%,rgba(211,162,78,.16),transparent 70%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,64px);align-items:center}
.hero .lede{margin:24px 0 32px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.fair-pill{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:9px 18px 9px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line-navy);font:500 13px/1.3 var(--sans);color:var(--on-navy);text-decoration:none}
.fair-pill b{display:inline-grid;place-items:center;height:26px;padding:0 10px;border-radius:999px;background:linear-gradient(135deg,var(--gold-lo),var(--gold-hi));color:var(--navy);font-weight:600;font-size:12px;letter-spacing:.06em}
.fair-pill:hover{border-color:var(--gold)}
.still{position:relative;aspect-ratio:1.08/1}
.still .arch{position:absolute;inset:6% 0 0 14%;border-radius:999px 999px 34px 34px;background:linear-gradient(160deg,rgba(240,213,148,.22),rgba(211,162,78,.08) 55%,rgba(211,162,78,0));border:1px solid rgba(240,213,148,.25)}
.still img{position:absolute;filter:drop-shadow(0 28px 30px rgba(0,0,0,.45)) drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.still .p1{width:78%;left:12%;top:18%;transform:rotate(-6deg)}
.still .p2{width:40%;left:0;bottom:4%}
.still .p3{width:44%;right:-2%;bottom:0;transform:rotate(8deg)}
.still .p4{width:9%;right:14%;top:2%;transform:rotate(18deg)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.still{order:-1;max-width:520px;width:100%;margin:0 auto}}

/* ribbon */
.ribbon{background:linear-gradient(90deg,var(--gold-lo),var(--gold) 50%,var(--gold-lo));color:var(--navy);overflow:hidden;white-space:nowrap}
.ribbon .track{display:inline-flex;gap:38px;padding:14px 0;font:600 13px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;animation:slide 38s linear infinite}
.ribbon .track span::after{content:"✦";margin-left:38px;opacity:.55}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ribbon .track{animation:none}}

section{position:relative;padding:clamp(72px,9vw,128px) 0}

/* about */
.about-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(28px,5vw,88px);align-items:center}
.logo-draw{width:100%;max-width:520px;color:var(--ink)}
.logo-draw path{fill:currentColor;fill-opacity:0;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.logo-draw.go path{animation:draw 1.5s cubic-bezier(.55,.1,.35,1) forwards,fillin .6s ease forwards;animation-delay:calc(var(--i) * 55ms),calc(900ms + var(--i) * 55ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-width:0}}
@media (prefers-reduced-motion:reduce){.logo-draw path{animation:none!important;fill-opacity:1;stroke-width:0;stroke-dashoffset:0}}
.about-copy p{font-size:17.5px}
.about-copy .muted{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.facts span{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:500 13px/1 var(--sans);color:var(--ink-deep)}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}.logo-draw{max-width:380px}}

/* materials */
.materials{background:var(--paper-2)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(30px,4vw,54px)}
.sec-head .lede{margin:0}
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){.mat-grid{grid-template-columns:1fr}}
.mat{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.mat .stage{position:relative;aspect-ratio:1.25/1;background:radial-gradient(70% 60% at 50% 55%,#fff 0%,var(--paper) 60%,var(--paper-2) 100%)}
.mat .stage img{position:absolute;inset:0;margin:auto;max-width:72%;max-height:74%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 22px 22px rgba(60,40,20,.28)) drop-shadow(0 4px 6px rgba(60,40,20,.2));transition:transform .5s ease}
.mat:hover .stage img{transform:scale(1.04) rotate(-1.5deg)}
.mat .body{padding:22px 24px 26px}
.mat h3{margin-bottom:8px}
.mat p{font-size:15px;color:var(--muted);margin:0 0 16px}
.thumbs{display:flex;gap:10px}
.thumbs div{position:relative;flex:1;aspect-ratio:1/1;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.thumbs img{position:absolute;inset:0;margin:auto;max-width:76%;max-height:76%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(60,40,20,.22))}
.also{margin-top:26px;text-align:center;color:var(--muted);font-size:15px}

/* collection */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:980px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.gallery{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{margin:0;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.tile .ph{position:relative;aspect-ratio:1/1;background:radial-gradient(70% 70% at 50% 50%,#fff,var(--paper) 75%)}
.tile img{position:absolute;inset:0;margin:auto;max-width:78%;max-height:78%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 16px 16px rgba(60,40,20,.25)) drop-shadow(0 3px 4px rgba(60,40,20,.18));transition:transform .45s ease}
.tile:hover img{transform:translateY(-4px) scale(1.04)}
.tile figcaption{padding:12px 16px 14px;font:500 13.5px/1.35 var(--sans);color:var(--ink-deep);border-top:1px solid var(--line)}
.tile figcaption small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.gal-note{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding:18px 22px;border-radius:18px;border:1px dashed rgba(185,138,62,.6);background:rgba(255,252,246,.7)}
.gal-note p{margin:0;color:var(--muted)}

.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:clamp(30px,4vw,52px)}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{padding:28px 26px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--line-navy)}
.step .n{font:500 italic 46px/1 var(--serif);color:var(--gold)}
.step h3{margin:12px 0 8px;color:#fff}
.step p{margin:0;color:var(--on-navy-muted);font-size:15px}

/* fair */
.fair-grid{display:grid;gap:22px}
.fair-row{display:grid;grid-template-columns:1.3fr .7fr;gap:22px}
@media (max-width:900px){.fair-row{grid-template-columns:1fr}}
.past-card{border-radius:28px;background:var(--card);border:1px solid var(--line);padding:28px 26px}
.past-card h3{font-size:26px;margin-bottom:14px}
.past-card ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.past-card li{color:var(--muted);font-size:15px;line-height:1.45}
.past-card li b{display:block;color:var(--ink-deep);font-weight:500}
.ticket{position:relative;display:grid;grid-template-columns:1.1fr auto 1fr;border-radius:28px;background:var(--ink);color:#fff;overflow:hidden;box-shadow:0 30px 60px -30px rgba(29,30,92,.6)}
.ticket::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 0% 0%,rgba(240,213,148,.2),transparent 55%);pointer-events:none}
.t-left,.t-mid,.t-right{padding:clamp(24px,3.4vw,40px);position:relative}
.t-left .eyebrow{color:var(--gold-hi)}
.t-left h2{color:#fff;font-size:clamp(32px,3.2vw,44px)}
.t-left p{color:rgba(255,255,255,.8);margin:14px 0 0;font-size:15px}
.t-mid{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-left:2px dashed rgba(240,213,148,.45);border-right:2px dashed rgba(240,213,148,.45);min-width:190px}
.t-mid .hall{font:500 13px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi)}
.t-mid .big{font:600 clamp(58px,6.4vw,86px)/.95 var(--serif);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;color:#fff;margin:6px 0 10px}
.t-mid .stand{font:600 clamp(18px,2vw,23px)/1.2 var(--sans);letter-spacing:.04em;color:var(--gold-hi)}
.nt{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--paper)}
.nt.tl{left:-16px;top:-15px}.nt.bl{left:-16px;bottom:-15px}.nt.tr{right:-16px;top:-15px}.nt.br{right:-16px;bottom:-15px}
.t-right{display:flex;flex-direction:column;justify-content:center;gap:8px}
.t-right .when{font:500 19px/1.35 var(--sans);color:#fff}
.t-right .where{font-size:14.5px;color:rgba(255,255,255,.78);margin-bottom:10px}
.t-actions{display:flex;flex-wrap:wrap;gap:10px}
.t-actions .btn{min-height:44px;font-size:14px;padding:0 18px}
.btn-ghost{border:1.5px solid rgba(255,255,255,.5);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
@media (max-width:860px){.ticket{grid-template-columns:1fr}.t-mid{border:0;border-top:2px dashed rgba(240,213,148,.45);border-bottom:2px dashed rgba(240,213,148,.45);flex-direction:row;gap:18px;justify-content:flex-start;text-align:left}.t-mid .big{margin:0}.nt{display:none}}
.stand-photo{margin:0;border-radius:28px;overflow:hidden;position:relative;min-height:280px;background:var(--navy)}
.stand-photo img{width:100%;height:100%;object-fit:cover}
.stand-photo figcaption{position:absolute;left:14px;bottom:14px;right:14px;padding:10px 14px;border-radius:14px;background:rgba(20,24,63,.78);backdrop-filter:blur(6px);color:#fff;font-size:13px}
.past{margin-top:18px;color:var(--muted);font-size:14.5px}
.fair-after{display:none}
.is-after .fair-before{display:none}
.is-after .fair-after{display:block}
.is-after .t-actions.fair-after,.is-after .fair-pill.fair-after{display:flex}

/* contact */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:clamp(28px,4vw,48px)}
@media (max-width:900px){.contact-grid{grid-template-columns:1fr}}
.c-card{display:flex;flex-direction:column;gap:6px;padding:28px 26px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);transition:border-color .2s ease,transform .2s ease}
a.c-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.c-card .k{font:500 12px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-lo)}
.c-card .v{font:500 clamp(18px,1.9vw,21px)/1.4 var(--sans);color:var(--ink-deep);word-break:break-word}
.c-card .s{font-size:14px;color:var(--muted)}
